services:
    mysql:
        image: mysql:8.4.11
        container_name: mysql-server-watchers-hub
        restart: unless-stopped
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "no"
            MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}" # dev default; override via env
            MYSQL_DATABASE: watchers_hub
            MYSQL_ROOT_HOST: "%"
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

    phpmyadmin: # Only for development purposes, remove in production
        image: phpmyadmin:latest
        container_name: phpmyadmin-watchers-hub
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_ARBITRARY: 0
        ports:
            - "8080:80"

volumes:
    mysql-data:
        driver: local

name: watchers-hub
